
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | QuickNotes</title>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple place to capture ideas.</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <h2>Welcome to QuickNotes</h2>
        <p>
            Capture your thoughts, organize your ideas,
            and keep important information in one place.
        </p>

        <section>
            <h2>My Notes</h2>
            <p>Start writing your notes here.</p>

            <form>
                <label for="note">Write a note:</label>
                <br>
                <textarea id="note" name="note"
                    rows="5" cols="40"></textarea>
                <br>
                <button type="submit">Save Note</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
</body>
</html>
