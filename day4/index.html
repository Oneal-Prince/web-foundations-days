<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4: Note Taker & Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>Day 4 Assignment</h1>
            <button id="theme-toggle">Dark mode</button>
        </header>

        <section class="editor-section">
            <label for="note-text">Your Note:</label>
            <textarea id="note-text" placeholder="Type your note here... (Press Escape to clear)"></textarea>
        </section>

        <section class="stats-section">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </section>

        <footer class="actions">
            <button id="clear-btn">Clear Note</button>
        </footer>
    </main>
</body>
</html>
